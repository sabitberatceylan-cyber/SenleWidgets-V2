name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.4.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.4-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenleWidgets-APK
          path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v2.4.0
          name: "Senle Widgets v2.4 (Samsung One UI 8.5 AOD & Kilit Ekranı Paketi)"
          body: |
            ## 🔒 Senle Widgets v2.4 - Samsung One UI 8.5 Kilit Ekranı & AOD Paketi

            Bu güncelleme ile Samsung One UI 8.5 Kilit Ekranı ve Always On Display (AOD) entegrasyonu tamamlandı!

            ### ✨ Yenilikler:
            - **🔒 Özel 2x1 Kilit Ekranı & AOD Kompakt Müzik Hapı:**
              - Samsung One UI kilit ekranı saat altı slotları için özel kompakt hap (pill) tasarımı (`MusicLockW21`).
              - `android:initialKeyguardLayout` ve `keyguard|home_screen` desteği eklendi.
            - **🎵 Spotify & Medya Çalar Widget'ları (1x3, 1x4, 2x2, 4x2):**
              - 1x4 ve 1x3 formatında yana uzatılabilir banner'lar ve 2x2 kare albüm kartları.
              - Canlı parça bilgisi, sanatçı ve albüm kapağı.
              - Anlık kontroller: Önceki şarkı (⏮), Oynat/Durdur (▶/⏸), Sonraki şarkı (⏭).
            - **📱 Samsung One UI Kilit Ekranı ve Good Lock / LockStar Rehberi:**
              - Uygulama içine tek dokunuşla kilit ekranı ayarlarını açma ve LockStar ile doğrudan AOD'ye widget koyma kılavuzu eklendi.
            - **🔐 Kalıcı Release Keystore Sertifikası (v1 + v2 + v3):**
              - Google Drive ve cihaz hafızasından sorunsuz kurulum.
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
