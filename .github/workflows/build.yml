name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.11.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.11-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: SenleWidgets-APK
            path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
            tag_name: v2.11.0
            name: "Senle Widgets v2.11 (Müzik Çalmazken Gizle Onarımı & Donanım Ses Senkronizasyonu)"
            body: |
              ## 🚀 Senle Widgets v2.11 - Müzik Çalmazken Gizle Onarımı
              
              ### ✨ Yapılan Düzenlemeler:
              - **👻 Müzik Çalmazken Gizle Sorunu Tamamen Düzeltildi:**
                - Ana uygulamada veya widget ayarlarında "Müzik çalmazken gizle" açıldığında, şarkı durduğu an widget'ın ekranda kalmasına sebep olan filtre ve ana ekran kısıtlaması kaldırıldı.
                - Tüm müzik widget'ları (2x2, 4x1 ve Kilit Ekranı) ayar açıkken müzik durduğu/duraklatıldığı an ekrandan tamamen kaybolur (`View.GONE` + 1x1 şeffaf bitmap).
                - Spotify'da şarkı çalmaya başladığı anda canlı albüm kapağıyla birlikte otomatik olarak ekranda belirir.
              - **🔊 Donanımsal Ses Durumu (AudioManager) Entegrasyonu:**
                - Medya oturumu gecikmelerine takılmamak için cihazın donanımsal ses durumu doğrudan denetlenir, müzik kapandığı an widget anında gizlenir.
              - **⚙️ Ayar Senkronizasyonu:**
                - Ana uygulamadaki anahtar değiştirildiğinde veya "Kaydet ve Uygula"ya basıldığında mevcut tüm eklenmiş widget'lar tek seferde yeni ayara senkronize edilir.
              - **🕒 Saat Tasarımı & Spotify Direkt Açma:**
                - v2.10 ile getirilen dengeli saat mizanpajı ve Spotify'ı doğrudan açma özellikleri eksiksiz korunmaktadır.
            files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
