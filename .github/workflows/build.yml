name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.9.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.9-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: SenleWidgets-APK
            path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
            tag_name: v2.9.0
            name: "Senle Widgets v2.9 (Doğrudan Spotify Açma & Sadece Kilit Ekranında 2x2 Gizleme)"
            body: |
              ## 🚀 Senle Widgets v2.9 - Doğrudan Spotify Açma & Sadece Kilit Ekranında Gizlenme

              ### ✨ Yapılan Düzenlemeler:
              - **🎵 Tıklayınca YALNIZCA Spotify Açılır:**
                - Spotify widget'larına (kart gövdesine, albüm kapağına veya şarkı adına) dokunulduğunda uygulamamız veya ayarlar değil, doğrudan orijinal **Spotify uygulaması** açılır.
                - Önceki, Oynat/Durdur ve Sonraki tuşları medya kontrollerini gerçekleştirmeye devam eder.
              - **🔒 SADECE Kilit Ekranında 2x2 Widget Gizlenir:**
                - Ana ekrandaki 2x2 Spotify widget'ı şarkı çalsın veya çalmasın daima ekranda görünür kalır.
                - Yalnızca **kilit ekranına (LockStar / Keyguard)** eklenen 2x2 widget, şarkı çalmazken tamamen gizlenir (`View.GONE`) ve duvar kağıdını temiz tutar. Şarkı başladığında kilit ekranında canlı albüm kapağıyla anında belirir!
              - **🕒 Saat Yazısı Orijinal Boyutunda:**
                - Saat widget'ı orijinal autoSize boyutunda ve responsive mizanpajında korunmaktadır.
            files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
