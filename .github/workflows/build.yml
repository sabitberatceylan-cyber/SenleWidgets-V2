name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.6.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.6-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: SenleWidgets-APK
            path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
            tag_name: v2.6.0
            name: "Senle Widgets v2.6 (2x2 Kilit Ekranı Boyutlandırma & Otomatik Gizlenme)"
            body: |
              ## 🎵 Senle Widgets v2.6 - 2x2 Kilit Ekranı Onarımı, Büyütme & Otomatik Gizlenme

              Bu güncelleme ile kullanıcımızın kilit ekranındaki 2x2 Spotify widget'ı eski kusursuz stabil haline geri getirildi ve istenen boyut & gizlenme özellikleri eklendi!

              ### ✨ Yenilikler:
              - **🔒 2x2 Kilit Ekranı Widget'ı Eski Stabil Haline Döndürüldü:**
                - Ekrana kilit vurulduğunda araya giren otomatik tam ekran geçişi kaldırıldı.
                - Widget'a ve albüm kapağına dokunulduğunda doğrudan Spotify uygulamasının açılması sağlandı.
                - Önceki, Oynat/Durdur ve Sonraki tuşları kilit ekranında anında yanıt verecek şekilde optimize edildi.
              - **👻 Müzik Çalmazken Kilit Ekranında Otomatik Gizlenme:**
                - Spotify durduğunda veya şarkı çalmazken widget kilit ekranında tamamen kaybolur (tertemiz duvar kağıdı görünümü).
                - Spotify'da şarkı başladığı anda widget kilit ekranında canlı albüm kapağıyla otomatik belirir!
              - **📐 2x2 Widget Büyütme & Ölçeklendirme:**
                - Uygulama içinden `Normal`, `Büyük (+%25)` ve `Devasa (+Kenarsız)` boyut modları.
                - Yeni `3x3` ve `4x4` büyük kare kart widget seçenekleri eklendi!
                - Samsung kilit ekranı ve ana ekranda serbestçe büyütüp küçültebilme desteği (70dp - 600dp).
              - **🔐 Kalıcı Release Keystore Sertifikası (v1 + v2 + v3):**
                - Google Drive veya dahili depolamadan sorunsuz tek tıkla kurulum.
            files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
