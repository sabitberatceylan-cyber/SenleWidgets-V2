name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.1.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenleWidgets-APK
          path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v2.1.0
          name: "Senle Widgets v2.1 (One UI 8.5 & iOS Edition)"
          body: |
            ## 📱 Senle Widgets v2.1 (One UI 8.5 & Apple iOS Paketi)
            
            - 🍎 **Apple iOS Widget Stüdyosu**: iOS Takvim, Apple Weather, Apple Batarya Halka, Apple Minimal Saat, Apple Notlar/Hatırlatıcı kartları.
            - 💎 **Gerçek Şeffaflık & Opaklık Oranı**: %0 (Tamamen Görünmez/Şeffaf) ile %100 (Tam Opak) arası hassas ayar.
            - 🎨 **Gelişmiş Renk Seçici**: RGB kaydırıcılar, 24 hazır palet çipi ve doğrudan HEX renk girişi.
            - 📱 **Samsung One UI 8.5 Uyumu**: Samsung Takvim, Saat, Hava Durumu, Cihaz Bakımı ve Notlar entegrasyonu + One UI squircle köşe tasarımı.
            - 📐 **Serbest Yeniden Boyutlandırma**: 2x1, 2x2, 3x1, 3x2 desteği.
          files: release_apk/SenleWidgets-v2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
