name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.2.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.2-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenleWidgets-APK
          path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v2.2.0
          name: "Senle Widgets v2.2 (Samsung One UI 8.5 & Drive Kurulum Uyumlu)"
          body: |
            ## 📱 Senle Widgets v2.2 - Kalıcı Sertifikalı ve Drive Kurulum Uyumlu
            
            Bu sürüm **Kalıcı Release Keystore Sertifikası (v1 + v2 + v3)** ile imzalanmıştır. Google Drive ve Samsung One UI 8.5'te kurulum hatası ("Bir sorun oluştu / Paket ayrıştırılamadı") almamak için:
            
            1. **Önceki sürümü telefonunuzdan kaldırın** (farklı debug anahtarıyla yüklendiği için çakışmayı önlemek amacıyla).
            2. Google Drive'da dosyanın yanındaki **3 noktaya (⋮)** basıp **"İndir"** (Download) deyin.
            3. Samsung **"Dosyalarım" (My Files)** -> **"İndirilenler"** bölümünden `SenleWidgets-v2.2.apk` dosyasına dokunarak kurun!
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
