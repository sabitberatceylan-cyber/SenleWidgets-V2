name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.7.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.7-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: SenleWidgets-APK
            path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
            tag_name: v2.7.0
            name: "Senle Widgets v2.7 (AOD Albüm Kapağı, Sıfır Gecikmeli Saat & Donma Çözümleri)"
            body: |
              ## 🚀 Senle Widgets v2.7 - AOD/Kilit Ekranı Resim Onarımı, Gecikmesiz Saat & Takılma Çözümleri

              Bu sürümde kullanıcımızın bildirdiği 4 kritik sorun kökten çözüldü:

              ### ✨ Yenilikler & Düzeltmeler:
              - **🚫 Spotify Widget Tıklama Kapatıldı:**
                - Spotify widget'ına veya albüm kapağına dokunulduğunda istem dışı açılan ekran/uygulama davranışı kaldırıldı.
                - Artık yalnızca medya kontrol tuşları (Önceki, Oynat/Durdur, Sonraki) tıklamaya yanıt verir.
              - **🖼️ AOD & Kilit Ekranında 2x2 Albüm Kapağı Görünürlüğü:**
                - Samsung LockStar / Keyguard üzerinde wrap_content ölçümünde resmin 0 boyuta çökmesi `minHeight="85dp"` ve `minWidth="85dp"` ile engellendi.
                - Android Binder IPC 1MB sınırına takılmaması için kapak resimleri otomatik 240px güvenli boyuta ölçeklendi ve diske önbelleklendi.
              - **⏰ Saat Widget'larında Geride Kalma / Donma Tamamen Çözüldü:**
                - Statik çizim yerine Android SystemUI tarafından her dakika başında :00'da yerel olarak tetiklenen native `TextClock` mimarisine geçildi.
                - Pil tüketmeden, arka plan kısıtlamalarına takılmadan daima tam vaktinde çalışır.
              - **⚡ Medya Takılmaları & Senkronizasyon Onarımı:**
                - `MediaSessionManager.addOnActiveSessionsChangedListener` ile Spotify parça değişimleri anlık yakalanır.
                - Bağlantı kopmalarına karşı `requestRebind` ve çift aşamalı (200ms & 700ms) arabellek güncellemesi eklendi.
            files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
