name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.10.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.10-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: SenleWidgets-APK
            path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
            tag_name: v2.10.0
            name: "Senle Widgets v2.10 (Saat Yazı Boyutu ve Mizanpajı Eski Haline Döndürüldü)"
            body: |
              ## 🚀 Senle Widgets v2.10 - Saat Boyutu & Mizanpaj Onarımı
              
              ### ✨ Yapılan Düzenlemeler:
              - **🕒 Saat Yazısı Orijinal Boyutuna Döndürüldü:**
                - Büyüyen ve kartı kaplayan saat punto boyutu Apple Minimal tasarım standartlarına (34sp) ve orijinal ölçeğe geri çekildi.
              - **📐 Tüm Yazıların Sıkışıklığı Giderildi (Eski Mizanpaj):**
                - Birbirine yapışan "DÜNYA SAATİ", saat, tarih, şehir bilgisi ve alarm satırları arasındaki dikey boşluklar ve oranlar orijinal ferah haline getirildi (`layout_weight="1"` aralıkları ile mükemmel dengeli yerleşim).
                - 2x1 ve standart saat widget'larındaki boşluk ve boyutlar da optimize edildi.
              - **⏰ Geride Kalmayan Canlı TextClock Desteği Korundu:**
                - Saat donması veya geri kalması engellenerek Android SystemUI destekli gerçek zamanlı akış sürdürüldü.
              - **🎵 Doğrudan Spotify Açma & Sadece Kilit Ekranında 2x2 Gizleme Korundu:**
                - v2.9'daki Spotify'a doğrudan yönlendirme ve sadece kilit ekranında 2x2 widget'ın gizlenme özellikleri eksiksiz korunmaktadır.
            files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
