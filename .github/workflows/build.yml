name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.12.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.12-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: SenleWidgets-APK
            path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
            tag_name: v2.12.0
            name: "Senle Widgets v2.12 (Sadece 2x2 Gizleme, 1 Dk Mola Koruması & Orijinal iPhone Saat)"
            body: |
              ## 🚀 Senle Widgets v2.12 - Sadece 2x2 Gizleme, 1 Dk Mola Süresi & İlk Orijinal iPhone Saat
              
              ### ✨ Yapılan Düzenlemeler:
              - **👻 SADECE 2x2 Widget Gizlenir (4x1 ve Kilit Ekranı Sabit):**
                - Kullanıcının kesin talebi doğrultusunda 4x1 banner ve kilit ekranı hap widget'ı asla kaybolmaz, ekranda sabit kalır.
                - Yalnızca 2x2 müzik kartı şarkı çalmazken gizlenir.
              - **⏱️ 1 Dakika Mola / Duraklatma Koruması:**
                - Widget üzerinden şarkı duraklatıldığında veya durduğunda widget hemen kaybolmaz; 1 dakika boyunca ekranda kalarak kullanıcının tekrar oynatmasına veya parça değiştirmesine imkan tanır.
                - 1 dakika boyunca yeni şarkı başlatılmazsa widget nazikçe ekrandan kaybolur.
              - **🍎 Orijinal iPhone Saat Kartı Geri Getirildi:**
                - Kullanıcının çok beğendiği ilk orijinal tasarım (`generateIosClockBitmap` + `w_ios_card`) birebir geri yüklendi.
                - Apple Minimal turuncu başlık, kusursuz oranlı saat fontu, Türkçe tarih, İstanbul saat farkı ve alarm satırı ilk günkü mükemmel düzeninde!
            files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
