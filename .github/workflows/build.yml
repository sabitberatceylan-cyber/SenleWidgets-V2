name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.5.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.5-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: SenleWidgets-APK
            path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
            tag_name: v2.5.0
            name: "Senle Widgets v2.5 (iPhone Tarzı Tam Ekran AMOLED AOD Müzik Çalar)"
            body: |
              ## 🎵 Senle Widgets v2.5 - iPhone Tarzı Tam Ekran AMOLED AOD Müzik Çalar

              Kullanıcı isteği üzerine, kilit ekranı ve Always On Display'deki küçük widget sınırları aşılarak iPhone tarzı devasa tam ekran müzik oynatıcı entegre edildi!

              ### ✨ Yenilikler:
              - **🌙 iPhone Tarzı Tam Ekran AMOLED Always On Display (AOD):**
                - Saf siyah (`#000000`) AMOLED arka plan (piksel kapatarak sıfıra yakın pil tüketimi).
                - Devasa yüksek çözünürlüklü albüm kapağı (280x280dp yuvarlatılmış kart).
                - Akıcı kayan yazı şarkı adı (Marquee) ve sanatçı detayı.
                - Canlı şarkı süresi ve etkileşimli ilerleme çubuğu (Seek Bar).
                - Büyük dokunmatik medya kontrol butonları: Önceki (⏮), Dev Oynat/Durdur (▶/⏸), Sonraki (⏭).
              - **⚡ Akıllı Kilit Ekranı & AOD Entegrasyonu:**
                - `showWhenLocked` ve `turnScreenOn` ile kilit açmaya gerek kalmadan doğrudan ekranda görünür.
                - **Otomatik AOD Başlatma**: Müzik çalarken telefon kilitlendiğinde veya ekran kapandığında tam ekran müzik çalar otomatik olarak açılır.
                - **AOD Karartma Modu**: Tek dokunuşla ultra düşük parlaklığa geçerek geceleri göz yormayan gerçek Always On Display deneyimi sunar, ekrana dokunulduğunda uyanır.
              - **👆 Widget'tan Tek Dokunuşla Tam Ekrana Geçiş:**
                - Ana ekran veya kilit ekranındaki herhangi bir müzik widget'ının albüm kapağına dokunulduğunda doğrudan tam ekran AOD moduna geçer.
              - **🔐 Kalıcı Release Keystore Sertifikası (v1 + v2 + v3):**
                - Google Drive ve paket ayrıştırma hatası olmaksızın sorunsuz kurulur.
            files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
