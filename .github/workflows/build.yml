name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.3.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.3-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenleWidgets-APK
          path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v2.3.0
          name: "Senle Widgets v2.3 (Spotify, Kilit Ekranı & AOD Müzik Paketi)"
          body: |
            ## 🎵 Senle Widgets v2.3 - Spotify & AOD Müzik Paketi

            Bu sürümle birlikte Samsung One UI 8.5 ve Apple iOS tarzı Spotify & Medya Oynatıcı widget'ları eklendi!

            ### ✨ Yenilikler:
            - **🎵 Spotify & Medya Çalar Widget'ları:**
              - **4x1 & 3x1 Yatay Banner:** 1x4 ve 1x3 formatında yana uzatılabilir kompakt müzik banner'ı.
              - **2x2 & 4x2 Kartlar:** Kare albüm kapağı odaklı modern iOS tarzı kart tasarımı.
              - **Canlı Şarkı Bilgileri:** Çalan parça adı, sanatçı ve yüksek kaliteli albüm kapağı.
              - **Etkileşimli Kontroller:** Önceki şarkı (⏮), Oynat/Durdur (▶/⏸), Sonraki şarkı (⏭) ve doğrudan Spotify açma.
            - **🔒 Kilit Ekranı & Always On Display (AOD) Uyumu:**
              - `keyguard|home_screen` desteği ile Samsung One UI 8.5 kilit ekranı ve AOD widget menüsünde doğrudan kullanılabilir.
            - **🔐 Kalıcı Release Keystore Sertifikası (v1 + v2 + v3):**
              - Google Drive ve cihaz hafızasından sorunsuz kurulum ("Paket ayrıştırılamadı" hatası vermez).
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
