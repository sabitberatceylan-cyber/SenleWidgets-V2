name: Build SenleWidgets APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed APK
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/SenleWidgets-v2.8.apk || true
          cp app/build/outputs/apk/debug/*.apk release_apk/SenleWidgets-v2.8-debug.apk || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: SenleWidgets-APK
            path: release_apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
            tag_name: v2.8.0
            name: "Senle Widgets v2.8 (Saat Boyutu Eski Haline Getirildi & Sadece 2x2 Müzik Çalmazken Gizlenme)"
            body: |
              ## 🚀 Senle Widgets v2.8 - Saat Boyutu Orijinal Haline Getirildi & Sadece 2x2 Gizlenme

              ### ✨ Yapılan Değişiklikler:
              - **🕒 Saat Yazısı Orijinal Boyutuna Döndürüldü:**
                - Saat widget'ındaki büyütülmüş yazı boyutu kaldırıldı; kullanıcının alıştığı orijinal responsive autoSize boyutuna ve mizanpaja geri getirildi.
              - **👻 SADECE 2x2 Widget Şarkı Yokken Gizlenir:**
                - Kullanıcının talebi doğrultusunda yalnızca 2x2 müzik kartı Spotify şarkı çalmazken tamamen gizlenir (`View.GONE`).
                - 4x1 banner ve kilit ekranı widget'ları şarkı çalmazken de kaybolmaz, ekranda görünür kalmaya devam eder.
                - Spotify'da şarkı başladığı an 2x2 widget canlı albüm kapağıyla kilit ekranında ve ana ekranda otomatik olarak belirir!
              - **🚫 Spotify Widget Tıklama Davranışı Koruması:**
                - Widget arka planına ve albüm kapağına dokunulduğunda istem dışı ekran/uygulama açılması engellendi (sadece kontrol tuşları basılabilir).
              - **🖼️ AOD & Kilit Ekranı Albüm Kapağı Koruması:**
                - 240px güvenli IPC Binder ölçekleme ve `minHeight` koruması aktif.
            files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
